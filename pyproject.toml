[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroom-control"
version = "0.1.0"
description = "Mock-first mushroom cultivation control"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mushroom-control = "mushroom_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
